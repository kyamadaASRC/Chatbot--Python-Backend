<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Template Manager</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #111a2d;
      --muted: #9ca3af;
      --text: #e5e7eb;
      --accent: #6ee7ff;
      --border: #1f2937;
      --btn: #1f2a44;
      --btn-hover: #273554;
      --danger: #f87171;
    }
    body { padding: 24px; max-width: 1200px; margin: 0 auto; font-family: "Inter", system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    th, td { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; }
    th { cursor: pointer; user-select: none; background: #141f35; color: var(--text); }
    tr:hover td { background: rgba(110, 231, 255, 0.05); }
    .toolbar { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
    .btn { padding: 8px 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--btn); color: var(--text); cursor: pointer; transition: background 0.15s, color 0.15s, border 0.15s; }
    .btn:hover { background: var(--accent); color: #0b1220; border-color: var(--accent); }
    .btn.secondary { background: transparent; color: var(--accent); border-color: var(--accent); }
    .chip { padding: 4px 8px; border-radius: 12px; background: rgba(110, 231, 255, 0.12); color: var(--accent); font-size: 12px; border: 1px solid rgba(110, 231, 255, 0.35); }
    .muted { color: var(--muted); font-size: 14px; }
    .danger { color: var(--danger); }
    .status { margin-top: 8px; min-height: 20px; }
    input[type="search"] { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); min-width: 240px; background: var(--panel); color: var(--text); }
    input[type="search"]::placeholder { color: var(--muted); }
    .status-error { color: var(--danger); margin-right: 6px; font-weight: 600; cursor: default; }
    /* Simple loading spinner (grayscale-friendly) */
    .spinner-backdrop { position: fixed; inset: 0; background: linear-gradient(135deg, rgba(20,24,32,0.55), rgba(12,16,24,0.55)); display: none; align-items: center; justify-content: center; z-index: 999; }
    .spinner { width: 56px; height: 56px; border: 6px solid rgba(229,231,235,0.2); border-top-color: #f3f4f6; border-radius: 50%; animation: spin 0.9s linear infinite; box-shadow: 0 0 24px rgba(0,0,0,0.25); }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="spinner-backdrop" id="uploadSpinner"><div class="spinner"></div></div>
  <header>
    <div>
      <h1>Template Manager</h1>
      <p class="muted">Upload, delete, and search template manifest entries.</p>
    </div>
    <div class="actions">
      <div class="chip" id="manifestVectorStoreId">Manifest VS: …</div>
    </div>
  </header>

  <div class="toolbar">
    <input type="search" id="searchInput" placeholder="Search templates…" />
    <label class="btn secondary" for="fileInput">Upload Templates</label>
    <input type="file" id="fileInput" multiple hidden />
    <button class="btn secondary" id="refreshBtn">Refresh</button>
  </div>

  <div class="status" id="status"></div>

  <table id="templateTable">
    <thead>
      <tr>
        <th data-sort="file_name" style="min-width: 260px;">Template Name</th>
        <th data-sort="uploaded_at">Uploaded</th>
        <th style="min-width: 180px;">File ID</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script type="module" src="{{ url_for('static', filename='modules/templateManager.js') }}"></script>
</body>
</html>
